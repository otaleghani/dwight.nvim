name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Neovim
        uses: rhysd/action-setup-vim@v1
        with:
          neovim: true
          version: stable

      - name: Run tests
        run: |
          ok=true
          for f in lua/dwight/test_*.lua; do
            name=$(basename "$f" .lua)
            echo "::group::$name"
            if nvim --headless -u NONE \
                -c "lua dofile('lua/dwight/harness.lua')" \
                -c "lua dofile('$f')" \
                -c "lua _T.report()"; then
              echo "::endgroup::"
            else
              echo "::endgroup::"
              echo "::error::$name failed"
              ok=false
            fi
          done
          $ok

  style:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install StyLua
        uses: JohnnyMorganz/stylua-action@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          version: latest
          args: --check lua/
